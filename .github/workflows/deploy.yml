name: Deploy

# Every merge to `main` deploys both halves of the monorepo, in order:
#
#   1. backend  — gate, serverless deploy, API smoke test, migrate:up, verify
#                 (reverting the migrations it applied if verification fails)
#   2. frontend — sync Amplify config, trigger the Amplify build, wait for it
#
# Ordering matters: the frontend proxies to the backend, so the API must be live
# before the frontend that calls it is released.
#
# Docs: docs/CICD.md
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys. Two overlapping runs would race the CloudFormation stack
# and Amplify, so later runs queue instead of cancelling the in-flight one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  # Required for GitHub OIDC -> AWS role assumption (no long-lived keys).
  id-token: write

jobs:
  backend:
    name: Deploy backend + migrate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      # Declared at job level so EVERY step sees them. `${STAGE}` is used by the
      # deploy step and the summary, and the AWS CLI/serverless both read
      # AWS_REGION from the environment.
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: ${{ vars.STAGE }}
      API_BACKEND_URL: ${{ vars.API_BACKEND_URL }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      # Everything serverless.yml resolves with ${env:...}. These become the
      # Lambda functions' runtime configuration.
      #
      # Note: serverless.yml uses ${env:X, 'default'} for each of these, so a
      # missing value would NOT fail the deploy — it would ship an empty
      # MONGODB_URI/JWT_SECRET. That is what the preflight step below guards.
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TOTP_SECRET_ENCRYPTION_KEY: ${{ secrets.TOTP_SECRET_ENCRYPTION_KEY }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET }}
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      COGNITO_REGION: ${{ vars.COGNITO_REGION }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      S3_BUCKET_REGION: ${{ vars.S3_BUCKET_REGION }}
      TOTP_ISSUER: ${{ vars.TOTP_ISSUER }}
      # Deployed functions must talk to the real Cognito pool; `true` is a
      # local-development escape hatch only.
      COGNITO_OFFLINE: 'false'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Preflight - required configuration is present
        run: |
          set -euo pipefail
          missing=()
          for name in AWS_DEPLOY_ROLE_ARN AWS_REGION STAGE API_BACKEND_URL MONGODB_URI JWT_SECRET TOTP_SECRET_ENCRYPTION_KEY; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required configuration: ${missing[*]}. See docs/CICD.md for the full inventory."
            exit 1
          fi
          echo "All required configuration is present."

      - name: Install dependencies
        run: npm ci

      # Fail fast and cheap, before touching AWS.
      - name: Gate - typecheck, lint, route parity
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run verify:routes

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Deploy to AWS
        run: npm run deploy -- --stage "${STAGE}"

      # A cheap liveness probe that also proves the deployed code is the new
      # code: `{}` is valid JSON with no fields, so the register handler must
      # answer 400 with its own validation message.
      #
      # `/auth/session` is deliberately NOT asserted on its status code. It sits
      # behind the `auth-jwt` REQUEST authorizer, which returns a bare Deny
      # policy (no context.statusCode), so API Gateway answers 403 — the same
      # code it uses for a non-existent path. Only the "should be protected"
      # assertion below is meaningful, and a 200 there would be a real
      # regression. (Locally, serverless-offline reports 401 instead of 403.)
      - name: Smoke-test the deployed API
        env:
          API_BASE: ${{ vars.API_BACKEND_URL }}/${{ vars.STAGE }}
        run: |
          set -euo pipefail

          register_code=$(curl -s -o /tmp/register.json -w '%{http_code}' \
            -X POST "$API_BASE/auth/register" \
            -H 'Content-Type: application/json' -d '{}')
          echo "POST /auth/register (empty body) -> ${register_code} (expect 400)"
          if [ "$register_code" != "400" ]; then
            echo "::error::Expected 400 from POST /auth/register, got ${register_code}. Body:"
            cat /tmp/register.json
            exit 1
          fi
          if ! grep -q 'are required' /tmp/register.json; then
            echo "::error::POST /auth/register did not return the expected validation message. Body:"
            cat /tmp/register.json
            exit 1
          fi
          echo "Validation message confirmed: $(cat /tmp/register.json)"

          session_code=$(curl -s -o /dev/null -w '%{http_code}' "$API_BASE/auth/session")
          echo "GET  /auth/session (no auth header) -> ${session_code}"
          if [ "$session_code" = "200" ]; then
            echo "::error::/auth/session answered 200 without an Authorization header - the route is not protected."
            exit 1
          fi

      # `runUp()` records a migration in the changelog only AFTER its up()
      # resolved, so a migration that throws halfway leaves partial writes with
      # no changelog entry that `migrate:down` could find. Automatic rollback is
      # therefore only wired to the *verification* failure path below; an up()
      # exception fails the job for a human to look at.
      - name: Apply pending migrations
        id: migrate
        run: |
          set -euo pipefail
          npm run migrate:status

          set +e
          output=$(npm run migrate:up 2>&1)
          up_status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$up_status" -ne 0 ]; then
            echo "::error::migrate:up failed. A partially applied migration cannot be reverted automatically - inspect the database and the migration before re-running."
            exit 1
          fi

          applied=$(printf '%s\n' "$output" | grep -c '^MIGRATED UP:' || true)
          echo "applied=${applied}" >> "$GITHUB_OUTPUT"
          echo "Migrations applied in this run: ${applied}"

      - name: Verify migrations
        id: verify
        continue-on-error: true
        run: npm run verify:migrations

      - name: Revert migrations (verification failed)
        if: steps.verify.outcome == 'failure'
        run: |
          set -euo pipefail
          applied='${{ steps.migrate.outputs.applied }}'
          if [ "${applied:-0}" -gt 0 ]; then
            echo "::error::Migration verification failed - reverting the ${applied} migration(s) applied in this run."
            npm run migrate:down -- "${applied}"
          else
            echo "::error::Migration verification failed, but this run applied no migrations, so there is nothing to revert."
            exit 1
          fi
          echo "Reverted ${applied} migration(s); re-checking the reverted state."
          npm run verify:migrations
          echo "::error::Migration verification failed and the ${applied} new migration(s) were reverted. The backend functions are deployed but the schema changes were not kept - investigate before re-running."
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Backend deploy"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Stage | \`${STAGE}\` |"
            echo "| API base | \`${{ vars.API_BACKEND_URL }}/${STAGE}\` |"
            echo "| Migrations applied | ${{ steps.migrate.outputs.applied || '0' }} |"
            echo "| Migration verification | ${{ steps.verify.outcome }} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Deploy frontend (Amplify)
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    env:
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH_NAME || 'main' }}
      API_BACKEND_URL: ${{ vars.API_BACKEND_URL }}
      STAGE: ${{ vars.STAGE }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-amplify-${{ github.run_id }}

      - name: Preflight - Amplify app is configured
        run: |
          set -euo pipefail
          if [ -z "${AMPLIFY_APP_ID}" ]; then
            echo "::error::AMPLIFY_APP_ID is not set. Run scripts/bootstrap-cicd.sh once (see docs/CICD.md), then re-run this workflow."
            exit 1
          fi
          if [ -z "${API_BACKEND_URL}" ]; then
            echo "::error::API_BACKEND_URL is not set; refusing to write an empty value to Amplify. See docs/CICD.md."
            exit 1
          fi
          aws amplify get-app --app-id "$AMPLIFY_APP_ID" \
            --query 'app.{id:appId,name:name,platform:platform}' --output table

      # Amplify Hosting cannot accept a CI-built artifact for an SSR app
      # ("Amplify Hosting does not support manual deploys for server-side
      # rendered apps"), so the pipeline drives Amplify's own builder and waits
      # for it. Auto-build is switched off so this workflow is the only thing
      # that releases the frontend.
      #
      # `update-branch --environment-variables` REPLACES the whole branch-level
      # map, so every value must be sent together or existing entries are wiped.
      - name: Sync Amplify branch config
        env:
          SESSION_COOKIE_MAX_AGE_SECONDS: ${{ vars.SESSION_COOKIE_MAX_AGE_SECONDS || '604800' }}
        run: |
          set -euo pipefail
          aws amplify update-branch \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --no-enable-auto-build \
            --environment-variables \
              "API_BACKEND_URL=${API_BACKEND_URL},API_BACKEND_STAGE=${STAGE},SESSION_COOKIE_MAX_AGE_SECONDS=${SESSION_COOKIE_MAX_AGE_SECONDS},COOKIE_SECURE=true" \
            --output json > /dev/null
          echo "Amplify branch '${AMPLIFY_BRANCH}' config synced (auto-build disabled)."

      - name: Start Amplify build
        id: start
        run: |
          set -euo pipefail
          job_id=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE \
            --commit-id "$GITHUB_SHA" \
            --commit-message "$(git log -1 --pretty=%s)" \
            --query 'jobSummary.jobId' --output text)
          echo "job_id=${job_id}" >> "$GITHUB_OUTPUT"
          echo "Started Amplify job ${job_id} for commit ${GITHUB_SHA}"

      - name: Wait for Amplify build
        env:
          JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 1500 ))   # 25 minutes
          status=UNKNOWN

          while true; do
            status=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text)
            echo "[$(( deadline - $(date +%s) ))s remaining] status: ${status}"

            case "$status" in
              SUCCEED|FAILED|CANCELLED|CANCELLING) break ;;
            esac

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 25 minutes waiting for Amplify job ${JOB_ID} (last status: ${status})."
              exit 1
            fi
            sleep 15
          done

          if [ "$status" != "SUCCEED" ]; then
            echo "::error::Amplify build ${JOB_ID} ended as ${status}."
            aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.steps[].{step:stepName,status:status,log:logUrl}' \
              --output table || true
            exit 1
          fi
          echo "Amplify build ${JOB_ID} succeeded."

      - name: Smoke-test the deployed frontend
        run: |
          set -euo pipefail
          default_domain=$(aws amplify get-app --app-id "$AMPLIFY_APP_ID" \
            --query 'app.defaultDomain' --output text)
          frontend_url="https://${AMPLIFY_BRANCH}.${default_domain}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "${frontend_url}/admin/login")
          echo "GET ${frontend_url}/admin/login -> ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Expected 200 from ${frontend_url}/admin/login, got ${code}."
            exit 1
          fi
          {
            echo "### Frontend deploy"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| URL | ${frontend_url} |"
            echo "| Amplify job | \`${JOB_ID}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_ID: ${{ steps.start.outputs.job_id }}
