  # ---------------------------------------------------------------------------
  # Auth — JWT Authorizer
  # Use-case: validate the Authorization Bearer token for protected endpoints.
  # Handler: src/features/auth/authorizer/handler.ts
  # ---------------------------------------------------------------------------
  auth-jwt:
    handler: src/features/auth/authorizer/handler.handler

  # ---------------------------------------------------------------------------
  # WebSocket API — real-time admin/resident notifications
  # These three blocks are the ONLY thing that registers the WebSocket routes.
  # Without them serverless-offline starts no WS server (`ws://localhost:3002`
  # is the HTTP lambdaPort and answers the handshake with 404) and no deployed
  # WebSocket API exists at all. Auth is handled inside `$connect` via
  # `?token=<JWT>` (see src/features/ws/connect/handler.ts), so no authorizer.
  # `verify:routes` pins all three so they cannot silently disappear.
  # ---------------------------------------------------------------------------
  # API:     $connect    (open a connection)
  # Handler: src/features/ws/connect/handler.ts
  ws-connect:
    handler: src/features/ws/connect/handler.handler
    events:
      - websocket:
          route: $connect
  # API:     $disconnect (forget the closed connection)
  # Handler: src/features/ws/disconnect/handler.ts
  ws-disconnect:
    handler: src/features/ws/disconnect/handler.handler
    events:
      - websocket:
          route: $disconnect
  # API:     $default    (inbound client messages — unused, push-only)
  # Handler: src/features/ws/default/handler.ts
  ws-default:
    handler: src/features/ws/default/handler.handler
    events:
      - websocket:
          route: $default